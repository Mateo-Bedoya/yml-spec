%YAML 1.2
---
 
openapi: "3.0.3"
 
info:
  title: "Movie Theater Seat Selection API"
  version: "1.0.0"
  description: >
    Lets customers of a movie theater see which seats are open for a
    showtime, reserve the seats they want, and cancel a reservation.
    A reservation holds the seats for 10 minutes so the customer has time
    to pay. If the customer cancels or does not pay in time, the seats
    become available again for other customers.
 
paths:
 
  # GET
  /showtimes/{showtimeId}/seats:
    get:
      summary: "Get the seats for a showtime"
      parameters:
        - name: "showtimeId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Seat map: each seat's number, status and price."
          content:
            application/json:
              example:
                showtimeId: "SHOW123"
                seats:
                  - seatNumber: "A1"
                    status: "open"
                    price: 12.50
                  - seatNumber: "A2"
                    status: "taken"
                    price: 12.50
        "404":
          description: "Showtime not found."
 
  # POST
  /reservations:
    post:
      summary: "Reserve seats for 10 minutes"
      requestBody:
        required: true
        content:
          application/json:
            example:
              showtimeId: "SHOW123"
              seats:
                - seatNumber: "A1"
                  ticketType: "adult"
                - seatNumber: "A3"
                  ticketType: "child"
      responses:
        "201":
          description: "Seats reserved."
          content:
            application/json:
              example:
                reservationId: "RES789"
                seats:
                  - "A1"
                  - "A3"
                totalPrice: 22.50
                expiresAt: "2026-11-01T14:10:00Z"
        "400":
          description: "Missing or invalid information."
        "409":
          description: "One or more seats are already taken."
 
  # DELETE
  /reservations/{reservationId}:
    delete:
      summary: "Cancel a reservation"
      parameters:
        - name: "reservationId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Reservation canceled. The seats are open again."
        "404":
          description: "Reservation not found."
        "409":
          description: "Reservation already paid for, so it cannot be canceled."
...